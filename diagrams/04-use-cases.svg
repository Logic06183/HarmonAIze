<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1400 1000"
     width="1400"
     height="1000"
     shape-rendering="crispEdges"
     role="img"
     aria-labelledby="title desc">
  <title id="title">HarmonAIze Research Use Cases</title>
  <desc id="desc">Four research application areas for HarmonAIze: heat and health, air quality, climate and disease, and urban environment</desc>

  <defs>
    <!-- Gradients for visual interest - ALL VIBRANT -->
    <linearGradient id="heatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8E53;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="airGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="climateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="urbanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>

    <!-- Arrow marker definition -->
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#4F46E5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1000" fill="#F8FAFC"/>

  <!-- Connecting lines from center to quadrants - MUCH MORE VISIBLE -->
  <g id="connection-lines" opacity="0.8">
    <line x1="700" y1="430" x2="300" y2="180" stroke="#4F46E5" stroke-width="3" stroke-dasharray="8,4"/>
    <line x1="700" y1="430" x2="1100" y2="180" stroke="#4F46E5" stroke-width="3" stroke-dasharray="8,4"/>
    <line x1="700" y1="520" x2="300" y2="680" stroke="#4F46E5" stroke-width="3" stroke-dasharray="8,4"/>
    <line x1="700" y1="520" x2="1100" y2="680" stroke="#4F46E5" stroke-width="3" stroke-dasharray="8,4"/>
  </g>

  <!-- TOP-LEFT QUADRANT: Heat & Health -->
  <g id="heat-health-quadrant">
    <!-- Shadow (simple offset rect, no blur) -->
    <rect x="53" y="53" width="600" height="280" rx="12" fill="#000000" opacity="0.12"/>
    <!-- Main card -->
    <rect x="50" y="50" width="600" height="280" rx="12" fill="white" stroke="#FF6B6B" stroke-width="4" shape-rendering="crispEdges"/>

    <!-- Header with gradient bar -->
    <rect x="50" y="50" width="600" height="60" rx="12" fill="url(#heatGrad)"/>
    <rect x="50" y="95" width="600" height="15" fill="url(#heatGrad)"/>

    <!-- Icon: Sun with thermometer -->
    <g id="heat-icon" transform="translate(80, 65)">
      <!-- Sun -->
      <circle cx="15" cy="15" r="12" fill="#FFF" opacity="0.95"/>
      <circle cx="15" cy="15" r="8" fill="#FBBF24"/>
      <line x1="15" y1="0" x2="15" y2="5" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
      <line x1="15" y1="25" x2="15" y2="30" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="15" x2="5" y2="15" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
      <line x1="25" y1="15" x2="30" y2="15" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
      <line x1="5" y1="5" x2="8" y2="8" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
      <line x1="22" y1="22" x2="25" y2="25" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Title -->
    <text x="130" y="90" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="white" text-rendering="geometricPrecision">
      Heat &amp; Health
    </text>

    <!-- Content -->
    <text x="70" y="145" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1E293B" text-rendering="geometricPrecision">
      Research Question:
    </text>
    <text x="70" y="170" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FF6B6B" font-style="italic" text-rendering="geometricPrecision">
      "How do heat waves affect hospital admissions?"
    </text>

    <text x="70" y="205" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1E293B" text-rendering="geometricPrecision">
      Example Study:
    </text>
    <text x="70" y="230" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-rendering="geometricPrecision">
      <tspan x="70" dy="0">Link satellite temperature data to emergency</tspan>
      <tspan x="70" dy="20">room visits during extreme heat events</tspan>
    </text>

    <text x="70" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748B" text-rendering="geometricPrecision">
      <tspan font-weight="bold">Users:</tspan> Urban planners, public health departments
    </text>

    <!-- Decorative element - MORE VISIBLE -->
    <circle cx="600" cy="300" r="40" fill="#FF6B6B" opacity="0.25"/>
  </g>

  <!-- TOP-RIGHT QUADRANT: Air Quality & Respiratory Health -->
  <g id="air-quality-quadrant">
    <!-- Shadow (simple offset rect, no blur) -->
    <rect x="753" y="53" width="600" height="280" rx="12" fill="#000000" opacity="0.12"/>
    <!-- Main card -->
    <rect x="750" y="50" width="600" height="280" rx="12" fill="white" stroke="#A78BFA" stroke-width="4" shape-rendering="crispEdges"/>

    <!-- Header with gradient bar -->
    <rect x="750" y="50" width="600" height="60" rx="12" fill="url(#airGrad)"/>
    <rect x="750" y="95" width="600" height="15" fill="url(#airGrad)"/>

    <!-- Icon: Factory with smoke -->
    <g id="air-icon" transform="translate(780, 65)">
      <!-- Factory building -->
      <rect x="0" y="15" width="20" height="15" fill="#FFF" opacity="0.95"/>
      <rect x="5" y="8" width="8" height="22" fill="#FFF" opacity="0.95"/>
      <!-- Smoke clouds -->
      <circle cx="9" cy="4" r="4" fill="#94A3B8"/>
      <circle cx="13" cy="2" r="3.5" fill="#94A3B8"/>
      <circle cx="5" cy="3" r="3" fill="#94A3B8"/>
      <!-- Windows -->
      <rect x="2" y="18" width="4" height="4" fill="#A78BFA"/>
      <rect x="14" y="18" width="4" height="4" fill="#A78BFA"/>
    </g>

    <!-- Title -->
    <text x="830" y="90" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="white" text-rendering="geometricPrecision">
      Air Quality &amp; Respiratory Health
    </text>

    <!-- Content -->
    <text x="770" y="145" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1E293B" text-rendering="geometricPrecision">
      Research Question:
    </text>
    <text x="770" y="170" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#7C3AED" font-style="italic" text-rendering="geometricPrecision">
      "Does air pollution worsen asthma outcomes?"
    </text>

    <text x="770" y="205" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1E293B" text-rendering="geometricPrecision">
      Example Study:
    </text>
    <text x="770" y="230" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-rendering="geometricPrecision">
      <tspan x="770" dy="0">Combine PM2.5 satellite data with respiratory</tspan>
      <tspan x="770" dy="20">disease records to identify vulnerable populations</tspan>
    </text>

    <text x="770" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748B" text-rendering="geometricPrecision">
      <tspan font-weight="bold">Users:</tspan> Environmental health researchers, pediatricians
    </text>

    <!-- Decorative element - MORE VISIBLE -->
    <circle cx="1300" cy="300" r="40" fill="#A78BFA" opacity="0.25"/>
  </g>

  <!-- CENTER HUB: HarmonAIze -->
  <g id="center-hub">
    <!-- Shadow (simple offset rect, no blur) -->
    <rect x="504" y="384" width="400" height="180" rx="16" fill="#000000" opacity="0.15"/>
    <!-- Main card -->
    <rect x="500" y="380" width="400" height="180" rx="16" fill="white" stroke="#4F46E5" stroke-width="5" shape-rendering="crispEdges"/>
    <rect x="500" y="380" width="400" height="60" rx="16" fill="url(#centerGrad)"/>
    <rect x="500" y="425" width="400" height="15" fill="url(#centerGrad)"/>

    <!-- Logo/Icon area -->
    <g id="harmonaize-icon" transform="translate(550, 395)">
      <circle cx="15" cy="15" r="15" fill="white" opacity="0.95"/>
      <!-- DNA helix / connection symbol -->
      <path d="M 8 8 Q 15 12 22 8" stroke="#4F46E5" stroke-width="2.5" fill="none"/>
      <path d="M 8 15 Q 15 19 22 15" stroke="#4F46E5" stroke-width="2.5" fill="none"/>
      <path d="M 8 22 Q 15 26 22 22" stroke="#4F46E5" stroke-width="2.5" fill="none"/>
      <circle cx="8" cy="8" r="2.5" fill="#10B981"/>
      <circle cx="22" cy="8" r="2.5" fill="#10B981"/>
      <circle cx="8" cy="22" r="2.5" fill="#10B981"/>
      <circle cx="22" cy="22" r="2.5" fill="#10B981"/>
    </g>

    <!-- Title -->
    <text x="620" y="420" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="white" text-rendering="geometricPrecision">
      HarmonAIze
    </text>

    <!-- Tagline -->
    <text x="700" y="475" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1E293B" text-anchor="middle" font-style="italic" text-rendering="geometricPrecision">
      Connecting Environmental Exposures
    </text>
    <text x="700" y="495" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1E293B" text-anchor="middle" font-style="italic" text-rendering="geometricPrecision">
      to Health Outcomes
    </text>

    <!-- Arrow indicators -->
    <g id="arrow-nw" transform="translate(530, 410)">
      <path d="M 0 0 L -15 -15" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrowhead)"/>
    </g>
    <g id="arrow-ne" transform="translate(870, 410)">
      <path d="M 0 0 L 15 -15" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrowhead)"/>
    </g>
    <g id="arrow-sw" transform="translate(530, 540)">
      <path d="M 0 0 L -15 15" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrowhead)"/>
    </g>
    <g id="arrow-se" transform="translate(870, 540)">
      <path d="M 0 0 L 15 15" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrowhead)"/>
    </g>

    <!-- Features -->
    <text x="700" y="530" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4F46E5" text-anchor="middle" font-weight="bold" text-rendering="geometricPrecision">
      40+ Years of Data | Privacy-Preserving | Open Source | AI-Powered
    </text>
  </g>

  <!-- BOTTOM-LEFT QUADRANT: Climate Change & Disease -->
  <g id="climate-disease-quadrant">
    <!-- Shadow (simple offset rect, no blur) -->
    <rect x="53" y="623" width="600" height="280" rx="12" fill="#000000" opacity="0.12"/>
    <!-- Main card -->
    <rect x="50" y="620" width="600" height="280" rx="12" fill="white" stroke="#3B82F6" stroke-width="4" shape-rendering="crispEdges"/>

    <!-- Header with gradient bar -->
    <rect x="50" y="620" width="600" height="60" rx="12" fill="url(#climateGrad)"/>
    <rect x="50" y="665" width="600" height="15" fill="url(#climateGrad)"/>

    <!-- Icon: Mosquito with water drop -->
    <g id="climate-icon" transform="translate(80, 635)">
      <!-- Water drop -->
      <path d="M 5 5 Q 5 0 10 0 Q 15 0 15 5 Q 15 10 10 12 Q 5 10 5 5" fill="#3B82F6" opacity="0.7"/>
      <!-- Mosquito -->
      <ellipse cx="20" cy="15" rx="6" ry="4" fill="#334155"/>
      <circle cx="18" cy="14" r="2.5" fill="#1E293B"/>
      <line x1="14" y1="13" x2="10" y2="11" stroke="#334155" stroke-width="1.5"/>
      <line x1="14" y1="17" x2="10" y2="19" stroke="#334155" stroke-width="1.5"/>
      <line x1="26" y1="13" x2="30" y2="11" stroke="#334155" stroke-width="1.5"/>
      <line x1="26" y1="17" x2="30" y2="19" stroke="#334155" stroke-width="1.5"/>
    </g>

    <!-- Title -->
    <text x="130" y="660" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="white" text-rendering="geometricPrecision">
      Climate Change &amp; Disease
    </text>

    <!-- Content -->
    <text x="70" y="715" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1E293B" text-rendering="geometricPrecision">
      Research Question:
    </text>
    <text x="70" y="740" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#3B82F6" font-style="italic" text-rendering="geometricPrecision">
      "How does rainfall affect vector-borne diseases?"
    </text>

    <text x="70" y="775" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1E293B" text-rendering="geometricPrecision">
      Example Study:
    </text>
    <text x="70" y="800" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-rendering="geometricPrecision">
      <tspan x="70" dy="0">Analyze precipitation patterns and malaria/dengue</tspan>
      <tspan x="70" dy="20">outbreaks to predict disease risk zones</tspan>
    </text>

    <text x="70" y="850" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748B" text-rendering="geometricPrecision">
      <tspan font-weight="bold">Users:</tspan> Epidemiologists, WHO/CDC researchers
    </text>

    <!-- Decorative element - MORE VISIBLE -->
    <circle cx="600" cy="870" r="40" fill="#3B82F6" opacity="0.25"/>
  </g>

  <!-- BOTTOM-RIGHT QUADRANT: Urban Environment & Health Equity -->
  <g id="urban-equity-quadrant">
    <!-- Shadow (simple offset rect, no blur) -->
    <rect x="753" y="623" width="600" height="280" rx="12" fill="#000000" opacity="0.12"/>
    <!-- Main card -->
    <rect x="750" y="620" width="600" height="280" rx="12" fill="white" stroke="#10B981" stroke-width="4" shape-rendering="crispEdges"/>

    <!-- Header with gradient bar -->
    <rect x="750" y="620" width="600" height="60" rx="12" fill="url(#urbanGrad)"/>
    <rect x="750" y="665" width="600" height="15" fill="url(#urbanGrad)"/>

    <!-- Icon: City with tree -->
    <g id="urban-icon" transform="translate(780, 635)">
      <!-- Buildings -->
      <rect x="0" y="10" width="8" height="20" fill="#FFF" opacity="0.95"/>
      <rect x="10" y="15" width="10" height="15" fill="#FFF" opacity="0.95"/>
      <rect x="2" y="13" width="2" height="2" fill="#64748B"/>
      <rect x="2" y="18" width="2" height="2" fill="#64748B"/>
      <rect x="12" y="18" width="2" height="2" fill="#64748B"/>
      <rect x="16" y="18" width="2" height="2" fill="#64748B"/>
      <!-- Tree -->
      <rect x="23" y="20" width="2" height="10" fill="#78350F"/>
      <circle cx="24" cy="18" r="6" fill="#10B981"/>
      <circle cx="21" cy="16" r="4" fill="#059669"/>
      <circle cx="27" cy="16" r="4" fill="#059669"/>
    </g>

    <!-- Title -->
    <text x="830" y="660" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="white" text-rendering="geometricPrecision">
      Urban Environment &amp; Health Equity
    </text>

    <!-- Content -->
    <text x="770" y="715" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1E293B" text-rendering="geometricPrecision">
      Research Question:
    </text>
    <text x="770" y="740" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#059669" font-style="italic" text-rendering="geometricPrecision">
      "Do green spaces reduce health disparities?"
    </text>

    <text x="770" y="775" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1E293B" text-rendering="geometricPrecision">
      Example Study:
    </text>
    <text x="770" y="800" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-rendering="geometricPrecision">
      <tspan x="770" dy="0">Link vegetation indices (NDVI) to cardiovascular</tspan>
      <tspan x="770" dy="20">health outcomes by neighborhood income level</tspan>
    </text>

    <text x="770" y="850" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748B" text-rendering="geometricPrecision">
      <tspan font-weight="bold">Users:</tspan> Social epidemiologists, urban health researchers
    </text>

    <!-- Decorative element - MORE VISIBLE -->
    <circle cx="1300" cy="870" r="40" fill="#10B981" opacity="0.25"/>
  </g>

  <!-- BOTTOM BANNER -->
  <g id="bottom-banner">
    <rect x="0" y="930" width="1400" height="70" fill="#1E293B"/>

    <text x="700" y="965" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold" text-rendering="geometricPrecision">
      Enabling Climate-Health Research Across Disciplines and Settings
    </text>

    <text x="700" y="990" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle" text-rendering="geometricPrecision">
      Learn more at harmonaize.org | Open source, privacy-preserving, and built for researchers
    </text>
  </g>
</svg>
